{% extends "base.html" %}
{% block content %}
<article>
  <header class="note-detail-header">
    <h1>{{ post.title }}</h1>
    <div class="note-detail-meta">
      <time class="note-date" datetime="{{ post.date }}">{{ post.date }}</time>
      {% if post.updated and post.updated != post.date %}<span class="muted">updated {{ post.updated }}</span>{% endif %}
      <div class="note-tags">{% for t in post.tags %}<span class="tag-pill">{{ t }}</span>{% endfor %}</div>
    </div>
  </header>
  <div class="note-body">{{ post.body_html | safe }}</div>
</article>
{% endblock %}
