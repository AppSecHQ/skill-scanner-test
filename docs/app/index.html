<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://skillscan.io/">
<title>skillscan.io</title>
<style>body{font-family:system-ui,sans-serif;margin:3rem auto;max-width:40rem;padding:0 1rem;line-height:1.5}</style>
</head>
<body>
<p>The old skillscan.io app has been retired. Every skill, category, and registry now has its own page. Continuing to <a href="/">skillscan.io</a>.</p>
<script>
// /app/ is retired. Map the old single-page app's hash routes to real URLs, then fall back to the home page.
(function () {
  var h = location.hash;
  if (h === '#/notes') { location.replace('/research/'); return; }
  var m = h.match(/^#\/(skill|note)\/(.+)$/);
  if (!m) { location.replace('/'); return; }
  var kind = m[1], key = decodeURIComponent(m[2]);
  fetch('/data/redirects.json').then(function (r) { return r.json(); }).then(function (map) {
    var target = kind === 'skill' ? map.skills[key] : map.notes[key];
    location.replace(target || (kind === 'skill' ? '/skills/?q=' + encodeURIComponent(key) : '/research/'));
  }).catch(function () { location.replace('/'); });
})();
</script>
</body>
</html>
